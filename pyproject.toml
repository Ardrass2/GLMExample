[project]
name = "glmexample"
version = "0.1.0"
description = "A one-feature logistic GLM for parallel constraints in CAD sketches."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "lz4>=4.3,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26.4,<2",
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "sketchgraphs",
    "statsmodels>=0.14.4,<0.15",
    "tqdm>=4.66,<5",
    "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.uv.sources]
sketchgraphs = { path = "../external/CPTSketchGraphs/SketchGraphs/sketchgraphs" }
